<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vaultora — My Server Storage</title>
<link rel="stylesheet" href="/styles.css">
<meta name="theme-color" content="#2563eb">
</head>
<body>
<div id="loginView" class="login-wrap" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div class="logo" style="width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;font-weight:800">V</div>
      <h1>Vaultora</h1>
    </div>
    <p>My server's storage. Sign in to continue.</p>
    <label class="muted small" for="liUser">Username</label>
    <input id="liUser" name="username" autocomplete="username" required style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);margin:4px 0 10px">
    <label class="muted small" for="liPass">Password</label>
    <input id="liPass" name="password" type="password" autocomplete="current-password" required style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);margin:4px 0 10px">
    <div id="totpWrap" hidden>
      <label class="muted small" for="liTotp">Two-factor code</label>
      <input id="liTotp" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);margin:4px 0 10px">
    </div>
    <div id="loginErr" class="small" style="color:var(--danger);min-height:18px"></div>
    <button class="btn primary" style="width:100%" type="submit">Sign in</button>
    <p class="small muted" style="margin-top:12px">Self-hosted · no cloud · files stay on your server.</p>
  </form>
</div>

<div id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">V</span> Vaultora</div>
    <nav class="nav" id="nav">
      <button data-view="home">🏠<span>Home</span></button>
      <button data-view="files">📁<span>My Files</span></button>
      <button data-view="shared">🤝<span>Shared</span></button>
      <button data-view="recent">🕘<span>Recent</span></button>
      <button data-view="starred">⭐<span>Starred</span></button>
      <button data-view="trash">🗑️<span>Trash</span></button>
      <button data-view="admin" id="navAdmin" hidden>🛠️<span>Admin</span></button>
    </nav>
    <div class="storage-card" id="storageCard">
      <div class="small muted">Storage used</div>
      <div style="font-weight:700" id="storageText">…</div>
      <div class="bar"><i id="storageBar" style="width:0%"></i></div>
      <div class="small muted" id="storageBreak">…</div>
      <div class="small muted" id="appVer" title="Build version — check here after pressing Update">…</div>
    </div>
    <div class="userbox">
      <div class="avatar" id="avatar">?</div>
      <div style="flex:1;min-width:0"><div id="uname" style="font-weight:700"></div><div class="small muted" id="urole"></div></div>
      <button class="iconbtn" id="themeBtn" title="Toggle theme">🌓</button>
      <button class="iconbtn" id="logoutBtn" title="Sign out">⏻</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="iconbtn" id="menuBtn">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="search"><input id="searchInput" placeholder="Search files…  ( / )" autocomplete="off"></div>
      <button class="iconbtn" id="viewBtn" title="Toggle grid/list">▦</button>
    </div>
    <div class="toolbar" id="toolbar">
      <button class="btn primary" id="uploadBtn">⬆ Upload</button>
      <button class="btn" id="folderUpBtn" title="Upload a whole folder">📂 Folder</button>
      <button class="btn" id="mkdirBtn">＋ New folder</button>
      <span class="sp"></span>
      <span class="small muted" id="countLabel"></span>
    </div>
    <div class="bulkbar" id="bulkbar">
      <span id="selCount" style="font-weight:700"></span>
      <button class="btn sm" id="bulkDl">Download</button>
      <button class="btn sm" id="bulkMove">Move</button>
      <button class="btn sm" id="bulkDel">Delete</button>
      <button class="btn sm ghost" id="selClear">Clear</button>
    </div>
    <div class="content" id="content">
      <div class="drop-hint">Drop files here to upload — they go straight to this folder on your server.</div>
      <div id="listWrap"></div>
      <div id="adminWrap" hidden></div>
    </div>
  </div>
</div>

<input type="file" id="filePick" multiple hidden>
<input type="file" id="folderPick" webkitdirectory hidden>

<div id="upPanel"><div class="hd"><span style="flex:1" id="upTitle">Uploads</span><span class="small muted" id="upTotal"></span><button class="iconbtn" id="upClose">✕</button></div><div id="upList"></div></div>

<div class="overlay" id="modal"><div class="dialog" id="modalBox"></div></div>
<div id="preview"><div class="box"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><strong id="pvName" style="flex:1;overflow:hidden;text-overflow:ellipsis"></strong><a class="btn sm" id="pvDl" href="#">Download</a><button class="iconbtn" id="pvClose">✕</button></div><div id="pvBody"></div></div></div>
<div id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
