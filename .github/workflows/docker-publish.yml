name: Build and Push Vaultora Docker Image

# Every push to main rebuilds :latest on Docker Hub (multi-arch, so it runs
# on Intel/AMD homelabs AND ARM boards like Raspberry Pi).
# CasaOS then offers a one-click "Update" for the installed app.
on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'public/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'package.json'
      - 'package-lock.json'
      - 'openapi.yaml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Extra image tag (leave empty for auto)'
        required: false
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: moresonsun/vaultora

jobs:
  build:
    name: Build and push multi-arch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Version tags
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "DATE=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.DATE }}-${{ steps.version.outputs.VERSION }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.DATE }}-${{ steps.version.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
