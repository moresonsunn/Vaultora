name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck + production build
        run: npm run build

  compose-lint:
    name: Validate compose files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate root compose
        run: docker compose -f docker-compose.yml config -q

      - name: Validate CasaOS store compose
        run: docker compose -f casaos-appstore/Apps/vaultora/docker-compose.yml config -q

      - name: Validate store index.json
        run: python3 -c "import json; d=json.load(open('casaos-appstore/index.json')); assert d['apps'][0]['index']=='Apps/vaultora/docker-compose.yml', d; print('store index OK:', d['apps'][0]['id'])"

      - name: Rebuild store dist/ (spec check)
        run: |
          python3 scripts/build_store_dist.py
          python3 -c "import json; d=json.load(open('casaos-appstore/dist/index.json')); a=d['apps'][0]; assert all(k in a for k in ('id','title','version','compose_url','meta_url','content_hash')), a; print('dist index OK:', a['id'], a['version'])"
          python3 -c "import json; json.load(open('casaos-appstore/dist/store.json')); print('dist store OK')"
